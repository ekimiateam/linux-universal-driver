# This workflow will install Python dependencies, run tests and lint with a single version of Python
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: LUD test

on:
  push:
    branches: [ "develop" ]
  pull_request:
    branches: [ "develop" ]

permissions:
  contents: read

jobs:
  dco:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Check for DCO sign-off (advisory)
      shell: bash
      continue-on-error: true
      env:
        BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      run: |
        set -Eeuo pipefail
        zero_sha="0000000000000000000000000000000000000000"
        if [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = "$zero_sha" ]; then
          echo "No prior commit to compare against; skipping DCO check for this event."
          exit 0
        fi
        # Advisory: reports, does not gate. A human reviewer judges each pull request.
        unsigned=0
        while IFS= read -r commit; do
          # Presence check only: does not verify the trailer's name/email matches the
          # commit author, the way stricter DCO bots do.
          if ! git log -1 --format=%B "$commit" | grep -qE '^Signed-off-by: .+ <.+>$'; then
            subject="$(git log -1 --format=%s "$commit")"
            printf '::warning::Commit %s is missing a Signed-off-by trailer: %s\n' \
              "$commit" "${subject//%/%25}"
            unsigned=1
          fi
        done < <(git rev-list --no-merges "$BASE_SHA..$HEAD_SHA")
        if [ "$unsigned" -ne 0 ]; then
          echo "One or more commits are missing a DCO sign-off (see warnings above)."
        fi

  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.10
      uses: actions/setup-python@v3
      with:
        python-version: "3.10"
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8 pytest
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
    - name: Lint with flake8
      run: |
        # stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
    - name: Test with pytest
      run: |
        pytest
